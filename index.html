<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приглашение на свидание 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <div id="floating-hearts-layer" aria-hidden="true"></div>

  <!-- Background Photo Collage -->
  <div class="bg-photos" aria-hidden="true">
    <img class="bg-photo bg-p1" src="images/bg/photo-1.jpg" alt="" />
    <img class="bg-photo bg-p2" src="images/bg/photo-2.jpg" alt="" />
    <img class="bg-photo bg-p3" src="images/bg/photo-3.jpg" alt="" />
    <img class="bg-photo bg-p4" src="images/bg/photo-4.jpg" alt="" />
    <img class="bg-photo bg-p5" src="images/bg/photo-5.jpg" alt="" />
    <img class="bg-photo bg-p6" src="images/bg/photo-6.jpg" alt="" />
    <img class="bg-photo bg-p7" src="images/bg/photo-7.jpg" alt="" />
    <img class="bg-photo bg-p8" src="images/bg/photo-8.jpg" alt="" />
  </div>

  <div class="page-shell">

    <!-- Top Navigation -->
    <header class="top-header" id="home">
      <nav class="top-nav" aria-label="Навигация по приглашению">
        <div class="nav-links" role="tablist">
          <button type="button" class="nav-btn is-active" data-target="home">
            Главная <span aria-hidden="true">💗</span>
          </button>
          <button type="button" class="nav-btn" data-target="program">
            Что нас ждёт? <span aria-hidden="true">✨</span>
          </button>
          <button type="button" class="nav-btn" data-target="details">
            Когда и где? <span aria-hidden="true">📅</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <!-- Hero Section -->
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="hero-title">
          Моя вкусная девочка,<br />
          пойдёшь со мной на свидание?
        </h1>
        <p class="hero-subtitle">
          Твоё официальное приглашение на идеальный вечер
        </p>
      </section>

      <!-- Polaroid Program Section -->
      <section class="polaroid-section" id="program" aria-label="Программа вечера">

        <div class="polaroid-grid">
          <!-- Polaroid 1: Dinner -->
          <button type="button" class="polaroid-card tilt-left" data-modal="dinner">
            <div class="polaroid-photo">
              <img class="fit-contain" src="images/dinner.png" alt="Вкусный ужин — Остро!" />
            </div>
            <span class="polaroid-caption">Вкусный ужин&nbsp;<span aria-hidden="true">🍕</span></span>
          </button>

          <!-- Polaroid 2: Walk -->
          <button type="button" class="polaroid-card tilt-none" data-modal="walk">
            <div class="polaroid-photo">
              <img src="images/walk.png" alt="Прогулка по городу с крокодильчиком и котиком" />
            </div>
            <span class="polaroid-caption">Кошка и крокодил под <span class="nowrap">звёздами вдвоём&nbsp;<span aria-hidden="true">🌌</span></span></span>
          </button>

          <!-- Polaroid 3: Surprise -->
          <button type="button" class="polaroid-card tilt-right" data-modal="surprise">
            <div class="polaroid-photo">
              <img class="fit-contain" src="images/surprise.png" alt="Подарок-сюрприз" />
            </div>
            <span class="polaroid-caption">Сюрприз&nbsp;<span aria-hidden="true">🎁</span></span>
          </button>
        </div>
      </section>

      <!-- When & Where Box -->
      <section class="details-section" id="details" aria-label="Когда и где">
        <button type="button" class="details-card" id="details-trigger">
          <p class="detail-line">
            <strong>КОГДА:</strong> Суббота (вечер)&nbsp;<span aria-hidden="true">⏰</span>
          </p>
          <p class="detail-line">
            <strong>ГДЕ:</strong> Секрет!&nbsp;<span aria-hidden="true">🤫</span>
          </p>
          <p class="detail-line">
            <strong>ДРЕСС-КОД:</strong> Жду тебя в платьице&nbsp;<span aria-hidden="true">👗💖</span>
          </p>
        </button>
      </section>

      <!-- Action Buttons -->
      <section class="actions-section" id="actions" aria-label="Ответить на приглашение">
        <div class="actions-wrapper">
          <div class="cta-group">
            <button type="button" class="cta-btn" id="btn-yes-1" data-choice="yes-1">
              ДА, КОНЕЧНО!&nbsp;<span aria-hidden="true">❤️</span>
            </button>
            <button type="button" class="cta-btn" id="btn-yes-2" data-choice="yes-2">
              ОДНОЗНАЧНО ДА!&nbsp;<span aria-hidden="true">🥰</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Corner Characters -->
    <div class="bottom-characters">
      <!-- Bottom-left: Hand-drawn Crocodile + Cat with Red Heart -->
      <button type="button" class="corner-char corner-left" aria-label="Крокодильчик и котик" title="Тыкни нас! 💚">
        <img src="images/croco-cat.png" alt="Крокодильчик и котик с сердечком" />
      </button>

      <!-- Bottom-right: Hand-drawn crokokis signature & heart -->
      <button type="button" class="corner-char corner-right" aria-label="crokokis" title="crokokis 💚🖤">
        <img src="images/crokokis.png" alt="crokokis" />
      </button>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" id="modal-close" aria-label="Закрыть окно">✕</button>
      <div class="modal-badge" id="modal-badge" aria-hidden="true">💖</div>
      <h2 class="modal-title" id="modal-title">Заголовок</h2>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="script.js?v=5"></script>
</body>
</html>
